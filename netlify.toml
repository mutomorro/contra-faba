[build]
  command = "npm run build"
  publish = "dist"

# Astro emits /about/index.html and we advertise /about/ as canonical.
# Netlify's pretty_urls would strip the trailing slash and redirect, which is
# exactly the redirect hop this migration exists to avoid.
[build.processing.html]
  pretty_urls = false

# --- Redirects -------------------------------------------------------------
# Canonical host: www -> apex, preserving path and query.
[[redirects]]
  from = "https://www.contrafaba.com/*"
  to = "https://contrafaba.com/:splat"
  status = 301
  force = true

# Legacy URL that the previous Next.js build pointed at a route which never
# existed (/services/change-management-consultancy), producing a 404.
[[redirects]]
  from = "/change-management/*"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/change-management"
  to = "/services/"
  status = 301

# --- Headers ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Astro fingerprints hashed assets, so they are safe to cache immutably.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
