[build]
  command = "npm run build"
  publish = "dist"

# Astro emits /about/index.html and we advertise /about/ as canonical.
# Netlify's pretty_urls would strip the trailing slash and redirect, which is
# exactly the redirect hop this migration exists to avoid.
[build.processing.html]
  pretty_urls = false

# --- Redirects -------------------------------------------------------------
# Canonical host: www -> apex, preserving path and query.
[[redirects]]
  from = "https://www.contrafaba.com/*"
  to = "https://contrafaba.com/:splat"
  status = 301
  force = true

# Legacy URL that the previous Next.js build pointed at a route which never
# existed (/services/change-management-consultancy), producing a 404.
[[redirects]]
  from = "/change-management/*"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/change-management"
  to = "/services/"
  status = 301

# --- WordPress leftovers ---------------------------------------------------
# WordPress generates URLs the Astro site does not: its own sitemaps, RSS feeds
# and taxonomy archives. Google keeps requesting any it ever saw, and each one
# that 404s is a crawl wasted and a signal lost. This is the class of fault that
# left 118 URLs 404ing after the Mutomorro migration (SEO Incident Log,
# "Problem 2"), so it is closed off here up front.
#
# Rules are deliberately limited to paths where no real page exists or ever
# will. Netlify only applies an unforced rule when no file matches, and matches
# with or without a trailing slash - so there is no /services/* or /our-work/*
# catch-all here: without a live test it cannot be proven that one would never
# swallow a real page's slashless form.

# Old sitemap addresses -> the Astro sitemap index.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/wp-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/page-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/post-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Feeds and archives - the site has no blog, so these land on the homepage.
[[redirects]]
  from = "/feed/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/comments/feed/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/category/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/tag/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

# Common WordPress page-name variants for the pages that do exist.
[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact-us"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/our-services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/our-work/"
  status = 301

[[redirects]]
  from = "/portfolio/*"
  to = "/our-work/"
  status = 301

# --- Headers ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Astro fingerprints hashed assets, so they are safe to cache immutably.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
